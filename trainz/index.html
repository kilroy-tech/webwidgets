<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trainz Layout</title>
  <link rel="stylesheet" href="./css/trainz.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">Trainz / layout studio</p><h1>Model Railway</h1></div>
      <div class="connection"><span id="connectionDot"></span><span id="connectionText">Connecting</span></div>
    </header>
    <section class="workspace">
      <aside class="sidebar">
        <button id="modeToggle" class="mode-toggle" type="button" aria-pressed="false" aria-label="Switch to run mode"><span class="mode-option">EDIT</span><span class="mode-option">RUN</span><span class="mode-thumb" aria-hidden="true"></span></button>
        <div id="editControls" class="edit-controls">
          <div class="section-heading"><h2>Track palette</h2><div class="palette-tools"><button id="layoutMenuToggle" class="menu-toggle" type="button" aria-label="Open layout menu" aria-expanded="false">☰</button><div id="layoutMenu" class="layout-menu" hidden><button id="exportLayout" type="button">Download JSON</button><button id="importLayout" type="button">Import JSON</button></div></div></div>
          <input id="layoutFileInput" type="file" accept="application/json,.json" hidden>
          <div id="palette" class="palette"></div>
          <div class="tool-row"><button id="clearBoard" type="button">Clear board</button><button id="rotateTool" type="button">Rotate</button></div>
          <div class="instructions">Select a piece, then click an empty grid cell to place it. Click the selected cell again to rotate it. Double-click a station to name it.</div>
        </div>
        <div class="section-heading trains-heading"><h2>Trains</h2><button id="addTrain" type="button" class="small-button">+ Add</button></div>
        <div id="trainList" class="train-list"><div class="empty-state">No trains placed</div></div>
      </aside>
      <section class="board-wrap"><canvas id="board" aria-label="Train layout grid"></canvas><div id="toast" class="toast" role="status"></div></section>
    </section>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
