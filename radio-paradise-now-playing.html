<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Paradise Now Playing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #08131a;
      --bg-1: #0f2430;
      --panel: rgba(9, 24, 31, 0.78);
      --panel-2: rgba(14, 34, 44, 0.82);
      --line: rgba(143, 206, 225, 0.22);
      --ink: #e9f4f8;
      --muted: #9cb8c2;
      --accent: #34d6b3;
      --accent-2: #76c8ff;
      --danger: #ff7a7a;
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.34);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Space Grotesk", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 12%, rgba(118, 200, 255, 0.14), transparent 38%),
        radial-gradient(circle at 82% 4%, rgba(52, 214, 179, 0.16), transparent 44%),
        linear-gradient(180deg, var(--bg-1), var(--bg-0));
      background-attachment: fixed;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.09;
      background-image: radial-gradient(circle at 1px 1px, #ffffff 1px, transparent 0);
      background-size: 5px 5px;
    }

    .wrap {
      width: min(1060px, 96vw);
      margin: 34px auto 64px;
      animation: fade-up 360ms ease-out;
    }

    .hero {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(140deg, rgba(11, 32, 42, 0.8), rgba(9, 26, 35, 0.76));
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      padding: 22px;
      margin-bottom: 18px;
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .title {
      margin: 0;
      font-size: clamp(1.3rem, 2.2vw, 2rem);
      letter-spacing: 0.01em;
      flex: 1 1 auto;
      min-width: 0;
    }

    .badge {
      display: none;
    }

    .now {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 136px 1fr;
      gap: 14px;
      align-items: start;
    }

    .cover {
      width: 136px;
      height: 136px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid var(--line);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.25);
      background: rgba(255, 255, 255, 0.08);
    }

    .song-title {
      margin: 0;
      font-size: clamp(1.1rem, 1.8vw, 1.5rem);
      line-height: 1.22;
    }

    .meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .tiny {
      margin-top: 10px;
      font-family: "IBM Plex Mono", monospace;
      color: #abcbdb;
      font-size: 0.79rem;
      line-height: 1.4;
    }

    .status {
      margin-top: 10px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.8rem;
      color: #bfe4f2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .status.error {
      color: var(--danger);
    }

    .countdown-badge {
      font-size: 0.75rem;
      color: #76c8ff;
      font-weight: 500;
      flex-shrink: 0;
    }

    .history {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .history.collapsed .rows {
      display: none;
    }

    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(19, 46, 58, 0.86), rgba(13, 35, 45, 0.75));
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      user-select: none;
    }

    .toggle-arrow {
      transition: transform 200ms ease;
      font-size: 1rem;
    }

    .history.collapsed .toggle-arrow {
      transform: rotate(-90deg);
    }

    .compact .now {
      grid-template-columns: 88px 1fr;
      gap: 10px;
    }

    .compact .cover {
      width: 88px;
      height: 88px;
      border-radius: 10px;
    }

    .compact .song-title {
      font-size: 1.1rem;
    }

    .compact .meta {
      font-size: 0.9rem;
    }

    .compact .tiny {
      font-size: 0.75rem;
      margin-top: 6px;
    }

    .compact .row {
      grid-template-columns: 52px 42px 1fr;
      padding: 8px 12px;
      gap: 10px;
    }

    .compact .mini {
      width: 42px;
      height: 42px;
    }

    .compact .track {
      font-size: 0.88rem;
    }

    .player {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--panel-2);
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .play-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(52, 214, 179, 0.12);
      color: var(--accent);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 120ms ease, border-color 120ms ease;
      flex-shrink: 0;
    }

    .play-btn:hover {
      background: rgba(52, 214, 179, 0.22);
      border-color: var(--accent);
    }

    .play-btn:active {
      background: rgba(52, 214, 179, 0.32);
    }

    .play-btn.playing {
      background: rgba(255, 122, 122, 0.18);
      border-color: var(--danger);
      color: var(--danger);
    }

    .play-btn.playing:hover {
      background: rgba(255, 122, 122, 0.28);
    }

    .player-label {
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .volume-icon {
      font-size: 0.9rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 4px;
      border-radius: 2px;
      background: rgba(156, 184, 194, 0.2);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--bg-1);
    }

    .volume-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--bg-1);
    }

    .volume-slider:focus {
      outline: none;
    }

    @media (max-width: 760px) {
      .player {
        padding: 8px 12px;
        gap: 10px;
      }

      .play-btn {
        width: 36px;
        height: 36px;
        font-size: 1rem;
      }

      .volume-slider {
        width: 64px;
      }
    }

    .song-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      border-bottom: 1px solid rgba(52, 214, 179, 0.3);
      transition: border-color 120ms ease;
    }

    .song-link:hover {
      border-bottom-color: rgba(52, 214, 179, 0.7);
    }

    .rows {
      max-height: 58vh;
      overflow: auto;
    }

    .row {
      display: grid;
      grid-template-columns: 68px 56px 1fr;
      gap: 12px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(143, 206, 225, 0.12);
      opacity: 0;
      transform: translateY(8px);
      animation: row-in 220ms ease forwards;
    }

    .row:last-child {
      border-bottom: none;
    }

    .t {
      font-family: "IBM Plex Mono", monospace;
      color: #bfd8e2;
      font-size: 0.8rem;
    }

    .mini {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      border: 1px solid var(--line);
      object-fit: cover;
      background: rgba(255, 255, 255, 0.08);
    }

    .track {
      font-size: 0.95rem;
      line-height: 1.3;
    }

    .track b {
      font-weight: 700;
    }

    .track span {
      color: var(--muted);
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes row-in {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      .wrap {
        width: 98vw;
        margin: 24px auto 48px;
      }

      .title {
        font-size: clamp(1.1rem, 1.8vw, 1.4rem);
      }

      .now {
        grid-template-columns: 1fr;
      }

      .cover {
        width: 100px;
        height: 100px;
      }

      .song-title {
        font-size: 1rem;
      }

      .meta {
        font-size: 0.9rem;
      }

      .tiny {
        font-size: 0.75rem;
        margin-top: 6px;
      }

      .row {
        grid-template-columns: 52px 44px 1fr;
        padding: 8px 12px;
        gap: 10px;
      }

      .mini {
        width: 44px;
        height: 44px;
      }

      .track {
        font-size: 0.88rem;
      }
    }

    @media (max-width: 480px) {
      .hero {
        padding: 16px;
      }

      .wrap {
        width: 95vw;
        margin: 20px auto 48px;
      }

      .hero-top {
        flex-direction: column;
        align-items: flex-start;
      }

      .title {
        font-size: 1.2rem;
      }

      .badge {
        font-size: 0.75rem;
        padding: 4px 10px;
      }

      .now {
        grid-template-columns: 80px 1fr;
        gap: 8px;
      }

      .cover {
        width: 80px;
        height: 80px;
        border-radius: 8px;
      }

      .song-title {
        font-size: 0.95rem;
      }

      .meta {
        font-size: 0.85rem;
      }

      .tiny {
        font-size: 0.7rem;
      }

      .history-head {
        padding: 10px 12px;
        font-size: 0.95rem;
      }

      .row {
        grid-template-columns: 44px 40px 1fr;
        padding: 6px 10px;
        gap: 8px;
      }

      .mini {
        width: 40px;
        height: 40px;
        border-radius: 6px;
      }

      .track {
        font-size: 0.8rem;
      }

      .t {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <main class="wrap">
    <section class="hero">
      <div class="hero-top">
        <h1 class="title">Radio Paradise: Now Playing</h1>
        <div class="badge" id="refreshBadge">next refresh: --</div>
      </div>

      <div class="now">
        <img id="cover" class="cover" alt="Cover art" />
        <div>
          <h2 class="song-title" id="songTitle">Waiting for data...</h2>
          <div class="meta" id="songMeta"></div>
          <div class="tiny" id="songTiny"></div>
          <div class="status" id="statusLine">
            <span id="statusText">Starting...</span>
            <span id="countdownText" class="countdown-badge"></span>
          </div>
        </div>
      </div>

      <!-- Audio Player -->
      <section class="player">
        <button id="playBtn" class="play-btn" title="Play / Pause">▶</button>
        <span class="player-label">Stream Audio</span>
        <div class="volume-wrap">
          <span id="volIcon" class="volume-icon">🔊</span>
          <input type="range" id="volSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.30" />
        </div>
      </section>
    </section>

    <section class="history">
      <div class="history-head" id="historyHead">
        <span>Recent tracks</span>
        <span class="toggle-arrow">▼</span>
      </div>
      <div class="rows" id="rows"></div>
    </section>
  </main>

  <script type="module">
    import { initWebWidget } from "/apps/kilroy.groups/js/webwidget_sdk.js";

    const RP_URL = "https://api.radioparadise.com/api/nowplaying_list_v2022?chan=0&source=The%20Main%20Mix&player_id=&sync_id=chan_0&type=channel&mode=wip-channel&list_num=20";
    const WEBHOOK_ALIAS = "kilroy.ai.webhooks";
    const WEBHOOK_TRIGGER = "get_url";

    const widgetParams = new URLSearchParams(window.location.search);
    const sdk = initWebWidget({
      alias: widgetParams.get("alias") || widgetParams.get("webwidget_alias") || "kilroypublic.radio-paradise-now-playing",
      guid: widgetParams.get("guid") || widgetParams.get("webwidget_guid") || `rp-${Date.now()}`,
      focusBridgeEnabled: true,
      targetOrigin: window.location.origin,
    });

    const coverEl = document.getElementById("cover");
    const songTitleEl = document.getElementById("songTitle");
    const songMetaEl = document.getElementById("songMeta");
    const songTinyEl = document.getElementById("songTiny");
    const statusLineEl = document.getElementById("statusLine");
    const statusTextEl = document.getElementById("statusText");
    const countdownTextEl = document.getElementById("countdownText");
    const rowsEl = document.getElementById("rows");
    const historyHead = document.getElementById("historyHead");
    const historySection = document.querySelector(".history");

    sdk.onLifecycle((event) => {
      if (!event || !event.event) return;
      if (event.event === "WIDGET_CONNECTED") {
        setStatus("Widget connected", false);
      }
      if (event.event === "WIDGET_CLOSING") {
        setStatus("Widget closing", false);
      }
    });

    // Audio player elements
    const STREAM_URL = "http://stream.radioparadise.com/aac-320";
    const audio = new Audio();
    audio.volume = 0.30;
    audio.preload = "none";
    let isPlaying = false;

    const playBtn = document.getElementById("playBtn");
    const volSlider = document.getElementById("volSlider");
    const volIcon = document.getElementById("volIcon");

    let pollTimer = null;
    let countdownTimer = null;
    let historyCollapsed = false;

    function getQuery(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name) || "";
    }

    function setStatus(text, isError) {
      statusTextEl.textContent = text;
      statusLineEl.classList.toggle("error", Boolean(isError));
    }

    function toTime(ms) {
      if (!ms) return "--:--";
      const d = new Date(Number(ms));
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function parseApiResponse(payload) {
      const textCandidate =
        payload?.args?.results?.args?.[0]?.text ||
        payload?.output?.args?.[0]?.text ||
        payload?.results?.args?.[0]?.text ||
        payload?.args?.[0]?.text ||
        payload?.text ||
        payload;

      if (typeof textCandidate === "string") {
        return JSON.parse(textCandidate);
      }
      if (typeof textCandidate === "object" && textCandidate !== null) {
        return textCandidate;
      }
      throw new Error("Webhook returned an unexpected response shape.");
    }

    function render(data) {
      const songs = Array.isArray(data.song) ? data.song : [];
      const current = songs[0];
      const coverBase = data.cover_base_url || "https://img.radioparadise.com/";

      if (!current) {
        songTitleEl.textContent = "No track data available";
        songMetaEl.textContent = "";
        songTinyEl.textContent = "";
        rowsEl.innerHTML = "";
        return;
      }

      // Build clickable link for current song
      const currentLink = buildSongLink(current);
      songTitleEl.innerHTML = "";
      if (currentLink) {
        const link = document.createElement("a");
        link.href = currentLink;
        link.target = "_blank";
        link.className = "song-link";
        link.textContent = current.title || "Untitled";
        songTitleEl.appendChild(link);
      } else {
        songTitleEl.textContent = current.title || "Untitled";
      }

      songMetaEl.textContent = (current.artist || "Unknown artist") + " | " + (current.album || "Unknown album");
      songTinyEl.textContent = "started " + toTime(current.play_time) + " | duration " + Math.round((Number(current.duration || 0) / 1000) || 0) + "s";

      const coverPath = current.cover_med || current.cover_small || current.cover || "";
      coverEl.src = coverPath ? (coverBase + coverPath) : "";
      coverEl.style.visibility = coverPath ? "visible" : "hidden";

      rowsEl.innerHTML = "";
      // Skip the first song — it's already shown in the Now Playing section
      songs.slice(1).forEach((song, index) => {
        const row = document.createElement("div");
        row.className = "row";
        row.style.animationDelay = (index * 18) + "ms";

        const t = document.createElement("div");
        t.className = "t";
        t.textContent = toTime(song.play_time);

        const img = document.createElement("img");
        img.className = "mini";
        const rowCoverPath = song.cover_small || song.cover || "";
        img.src = rowCoverPath ? (coverBase + rowCoverPath) : "";
        img.alt = "cover";

        const track = document.createElement("div");
        track.className = "track";
        const trackTitle = song.title || "Untitled";
        const trackArtist = song.artist || "Unknown artist";
        const trackAlbum = song.album || "Unknown album";

        const songLink = buildSongLink(song);
        if (songLink) {
          const link = document.createElement("a");
          link.href = songLink;
          link.target = "_blank";
          link.className = "song-link";
          link.innerHTML = "<b>" + escapeHtml(trackTitle) + "</b>";
          track.appendChild(link);
          track.innerHTML += "<br><span>" + escapeHtml(trackArtist) + " | " + escapeHtml(trackAlbum) + "</span>";
        } else {
          track.innerHTML = "<b>" + escapeHtml(trackTitle) + "</b><br><span>" + escapeHtml(trackArtist) + " | " + escapeHtml(trackAlbum) + "</span>";
        }

        row.appendChild(t);
        row.appendChild(img);
        row.appendChild(track);
        rowsEl.appendChild(row);
      });
    }

    function buildSongLink(song) {
      if (!song || !song.song_id) return null;
      const artist = (song.artist || "").replace(/\s+/g, "_");
      const title = (song.title || "").replace(/\s+/g, "_");
      if (!artist || !title) return null;
      return "https://radioparadise.com/music/song/" + song.song_id + "/" + artist + "-" + title;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function setCountdown(seconds) {
      clearInterval(countdownTimer);
      let remaining = Math.max(1, Math.floor(seconds));
      countdownTextEl.textContent = remaining + "s";
      countdownTimer = setInterval(() => {
        remaining = Math.max(0, remaining - 1);
        countdownTextEl.textContent = remaining + "s";
      }, 1000);
    }

    async function fetchNowPlaying() {
      const token = getQuery("token") || "placeholder";
      const base = (getQuery("base") || window.location.origin).replace(/\/$/, "");

      const endpoint =
        base +
        "/api/v1/pd/webhook/" +
        encodeURIComponent(token) +
        "/" +
        encodeURIComponent(WEBHOOK_ALIAS) +
        "/" +
        encodeURIComponent(WEBHOOK_TRIGGER);

      const body = {
        from: "rp-now-playing-widget",
        type: "text/plain",
        text: "fetch " + RP_URL,
        sync: true,
        tfrom: "rp-now-playing-widget",
        tusername: "widget",
        tagentname: "rp-now-playing-widget",
        args: [{ text: RP_URL }],
        targs: JSON.stringify({
          url: RP_URL,
          content_type: "application/json"
        })
      };

      try {
        setStatus("Fetching via get_url webhook...", false);
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!response.ok) {
          throw new Error("Webhook HTTP " + response.status);
        }

        const webhookPayload = await response.json();
        const data = parseApiResponse(webhookPayload);
        render(data);

        const refreshSeconds = Math.max(5, Math.min(180, Number(data.refresh || 20)));
        setCountdown(refreshSeconds);
        clearTimeout(pollTimer);
        pollTimer = setTimeout(fetchNowPlaying, refreshSeconds * 1000);

        setStatus("Updated " + new Date().toLocaleTimeString(), false);
      } catch (err) {
        clearTimeout(pollTimer);
        setCountdown(15);
        pollTimer = setTimeout(fetchNowPlaying, 15000);
        setStatus("Update failed: " + (err && err.message ? err.message : String(err)), true);
      }
    }

    function hydrateDefaults() {
      // Token and base URL are passed via query params (?token=... &base=...)
      // No UI inputs to populate
    }

    // Audio player controls
    function updateVolIcon() {
      const v = audio.volume;
      if (v === 0) volIcon.textContent = "🔇";
      else if (v < 0.4) volIcon.textContent = "🔈";
      else if (v < 0.7) volIcon.textContent = "🔉";
      else volIcon.textContent = "🔊";
    }

    playBtn.addEventListener("click", () => {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        playBtn.textContent = "▶";
        playBtn.classList.remove("playing");
      } else {
        audio.src = STREAM_URL;
        audio.play().catch(() => {});
        isPlaying = true;
        playBtn.textContent = "⏸";
        playBtn.classList.add("playing");
      }
    });

    volSlider.addEventListener("input", () => {
      audio.volume = Number(volSlider.value);
      updateVolIcon();
    });



    historyHead.addEventListener("click", () => {
      historyCollapsed = !historyCollapsed;
      historySection.classList.toggle("collapsed", historyCollapsed);
    });

    hydrateDefaults();
    sdk.ready.then(() => fetchNowPlaying()).catch((err) => {
      setStatus("Widget init failed: " + (err && err.message ? err.message : String(err)), true);
      fetchNowPlaying();
    });
  </script>
</body>
</html>
